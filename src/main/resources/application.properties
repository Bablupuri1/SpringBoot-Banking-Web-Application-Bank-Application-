# Gmail SMTP server hostname (all mails will be sent through this server)
spring.mail.host=smtp.gmail.com

# SMTP server port
# 587 → used with STARTTLS encryption (recommended)
spring.mail.port=587

# Gmail ID from which emails will be sent
spring.mail.username=bablukumar7633017940@gmail.com

# Gmail App Password (NOT your normal Gmail login password)
# Must be generated from: https://myaccount.google.com/apppasswords
# Example format: 16-character string like "abcd efgh ijkl mnop"
spring.mail.password=mjdg mhuv ibnq qoxc


# Mail sending protocol (SMTP is standard for email)
spring.mail.protocol=smtp

# Enable SMTP authentication (username + app password required)
spring.mail.properties.mail.smtp.auth=true

# Enable STARTTLS encryption (secure connection)
spring.mail.properties.mail.smtp.starttls.enable=true















